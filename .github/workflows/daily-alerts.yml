name: StockSense Daily Alerts

on:
  schedule:
    # 7:00 AM WAT = 06:00 UTC. Cron is always in UTC, adjust if needed.
    - cron: "0 6 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab, for testing

jobs:
  run-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger alert digest endpoint
        run: |
          curl -f -X POST "${{ secrets.BACKEND_URL }}/api/alerts/run" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 90
