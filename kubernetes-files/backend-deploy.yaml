apiVersion: apps/v1
kind: Deployment
metadata:
  name: stocksense-backend
  namespace: stocksense
  labels:
    app: stocksense-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stocksense-backend
  template:
    metadata:
      labels:
        app: stocksense-backend
    spec:
      containers:
        - name: stocksense-backend
          image: veecode34/stocksense-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: stocksense-config
                  key: NODE_ENV

            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: stocksense-config
                  key: PORT

            - name: APP_URL
              valueFrom:
                configMapKeyRef:
                  name: stocksense-config
                  key: APP_URL

            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: stocksense-config
                  key: FRONTEND_URL

            - name: ML_URL
              valueFrom:
                configMapKeyRef:
                  name: stocksense-config
                  key: ML_URL

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stocksense-secret
                  key: DATABASE_URL

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stocksense-secret
                  key: JWT_SECRET

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20