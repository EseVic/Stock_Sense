apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stocksense-ml-service-hpa
  namespace: stocksense
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stocksense-ml-service
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75