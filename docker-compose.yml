services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stocksense_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./.env
    # environment:
    #   NODE_ENV: ${NODE_ENV}
    #   PORT: ${PORT}
    #   APP_URL: http://localhost:5173
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3001
    container_name: stocksense_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s